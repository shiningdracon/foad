<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120f18">
  <title>Flight of a Dragon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7ead3;
      --muted: #b5a68f;
      --panel: rgba(27, 22, 31, .9);
      --line: rgba(255, 218, 157, .2);
      --gold: #e6a54a;
      --ember: #cc5038;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% -20%, rgba(164, 64, 39, .3), transparent 45rem),
        linear-gradient(180deg, #17121c 0%, #09080c 100%);
      color: var(--ink);
      font-family: ui-monospace, "Cascadia Mono", "Noto Sans Mono", monospace;
      overscroll-behavior: none;
    }

    body { padding: clamp(14px, 3vw, 34px); }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: .95;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    #status {
      color: var(--muted);
      font-size: .75rem;
      text-align: right;
    }

    .console {
      position: relative;
      overflow: hidden;
      padding: clamp(7px, 1.7vw, 14px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #030304;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .03);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 620 / 456;
      border-radius: 10px;
      background: #000;
      image-rendering: pixelated;
      outline: none;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(3, 3, 4, .76);
      backdrop-filter: blur(5px);
      transition: opacity .2s ease;
    }

    #start-screen.hidden { opacity: 0; pointer-events: none; }

    .start-button, .utility-button {
      border: 1px solid rgba(255, 225, 174, .45);
      color: #1b1008;
      background: linear-gradient(180deg, #f4bc66, #cf7439);
      box-shadow: 0 10px 32px rgba(203, 75, 40, .3);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .start-button {
      min-width: 180px;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 1rem;
      letter-spacing: .08em;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .76rem;
    }

    .utility-button {
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .card h2 {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px;
      margin: 0;
      font-size: .76rem;
    }

    .keys div { display: flex; justify-content: space-between; gap: 10px; }
    kbd { color: var(--ink); font: inherit; font-weight: 700; }

    .touch-pad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      touch-action: none;
      user-select: none;
    }

    .game-key {
      min-height: 48px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(255, 255, 255, .055);
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
      touch-action: none;
    }

    .game-key.active {
      border-color: var(--gold);
      background: rgba(230, 165, 74, .25);
      transform: translateY(1px);
    }

    .fire { color: #ff9a72; }
    .jump { color: #9ed9a7; }

    @media (max-width: 720px) {
      body { padding: 10px; }
      header { align-items: start; }
      .controls { grid-template-columns: 1fr; }
      .toolbar span { display: none; }
      .touch-pad { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">A Uzebox adventure · WebAssembly edition</p>
        <h1>Flight of a Dragon</h1>
      </div>
      <div id="status">正在加载…</div>
    </header>

    <section class="console" aria-label="游戏画面">
      <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      <div id="start-screen">
        <button class="start-button" id="start-button" type="button">开始游戏</button>
      </div>
    </section>

    <div class="toolbar">
      <span>点击游戏画面后可使用键盘；高分自动保存在此浏览器中。</span>
      <button class="utility-button" id="fullscreen" type="button">全屏</button>
    </div>

    <section class="controls">
      <div class="card">
        <h2>键盘</h2>
        <div class="keys">
          <div><span>移动 / 瞄准</span><kbd>方向键</kbd></div>
          <div><span>跳跃</span><kbd>S / W</kbd></div>
          <div><span>喷火</span><kbd>A / Q</kbd></div>
          <div><span>步行</span><kbd>右 Shift</kbd></div>
          <div><span>向上看</span><kbd>左 Shift</kbd></div>
          <div><span>开始 / 选择</span><kbd>Enter / Space</kbd></div>
        </div>
      </div>

      <div class="card">
        <h2>触摸控制</h2>
        <div class="touch-pad" aria-label="屏幕控制器">
          <button class="game-key" data-key="ArrowLeft" data-code="37">◀</button>
          <button class="game-key" data-key="ArrowUp" data-code="38">▲</button>
          <button class="game-key" data-key="ArrowDown" data-code="40">▼</button>
          <button class="game-key" data-key="ArrowRight" data-code="39">▶</button>
          <button class="game-key fire" data-key="a" data-code="65">喷火</button>
          <button class="game-key jump" data-key="s" data-code="83">跳跃</button>
          <button class="game-key" data-key="Enter" data-code="13">开始</button>
          <button class="game-key" data-key=" " data-code="32">选择</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const statusNode = document.getElementById("status");
    const startScreen = document.getElementById("start-screen");

    var Module = {
      canvas,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus(message) {
        statusNode.textContent = message || "运行中";
      },
      monitorRunDependencies(left) {
        if (left) this.setStatus(`正在加载… ${left}`);
      }
    };

    function resumeGame() {
      startScreen.classList.add("hidden");
      canvas.focus();
      const context = window.SDL && SDL.audioContext;
      if (context && context.state === "suspended") context.resume();
    }

    document.getElementById("start-button").addEventListener("click", resumeGame);
    canvas.addEventListener("pointerdown", resumeGame);
    if (new URLSearchParams(location.search).get("autostart") === "1") {
      window.addEventListener("load", resumeGame);
    }

    document.getElementById("fullscreen").addEventListener("click", () => {
      if (Module.requestFullscreen) Module.requestFullscreen(false, false);
      else if (Module.requestFullScreen) Module.requestFullScreen(false, false);
      else canvas.requestFullscreen();
    });

    function sendKey(type, key, keyCode) {
      const event = new KeyboardEvent(type, {
        key,
        code: key,
        keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      });
      try {
        Object.defineProperty(event, "keyCode", { value: keyCode });
        Object.defineProperty(event, "which", { value: keyCode });
      } catch (_) {}
      canvas.dispatchEvent(event);
    }

    document.querySelectorAll(".game-key").forEach((button) => {
      const key = button.dataset.key;
      const code = Number(button.dataset.code);
      const release = (event) => {
        event.preventDefault();
        button.classList.remove("active");
        sendKey("keyup", key, code);
      };
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        button.classList.add("active");
        sendKey("keydown", key, code);
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", (event) => {
        if (button.classList.contains("active")) release(event);
      });
    });

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
